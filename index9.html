/* Goal detail V2.1 */
.goal-summary{display:grid;gap:12px}.goal-summary h2{font-size:20px;margin:0 0 5px}.goal-summary p{margin:0}.goal-tree-node{min-width:0}.goal-task-line{display:flex;align-items:center;gap:9px;min-height:56px;padding:9px 6px;border-bottom:1px solid var(--border)}.goal-task-line:hover{background:var(--raised);border-radius:9px}.goal-task-body{min-width:0;flex:1}.goal-task-name{display:inline-block;text-align:left;border:0;background:none;color:var(--text);font-weight:600;cursor:pointer;white-space:normal;overflow-wrap:anywhere;padding:0}.goal-task-name:hover{color:var(--brand)}.goal-task-name.goal-done{text-decoration:line-through;color:var(--muted)}.goal-task-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:12px;margin-top:5px}.goal-tree-children{margin-left:23px;padding-left:12px;border-left:1px solid var(--border)}.goal-date-group{margin-top:20px}.goal-date-head{display:flex;gap:12px;align-items:center;font-weight:700;padding:11px;background:var(--raised);border-radius:9px}.goal-session{display:flex;align-items:center;gap:12px;padding:13px 7px;border-bottom:1px solid var(--border)}.goal-session-time{width:105px;flex-shrink:0;color:var(--muted);font-size:12px}.goal-session .goal-task-name{flex:1}.goal-task-line .pill,.goal-session .pill{flex-shrink:0}@media(max-width:550px){.goal-task-line{gap:6px;flex-wrap:wrap}.goal-task-line .goal-task-meta{font-size:11px}.goal-tree-children{margin-left:9px;padding-left:7px}.goal-session{flex-wrap:wrap;gap:9px}.goal-session-time{width:100%}.goal-session .goal-task-name{min-width:50%}.goal-task-line .btn{padding:5px 7px}}

/* V2.2: independent completion for individual scheduled sessions */
.session-event{display:flex;gap:4px;align-items:center;min-width:0;}
.session-event .event{flex:1;min-width:0;width:auto;}
.session-calendar-check{flex:0 0 18px;width:18px;height:18px;margin:0 2px;cursor:pointer;}
.goal-session .check{flex-shrink:0;}
@media (max-width:650px){.session-event{gap:2px}.session-calendar-check{width:17px;height:17px;flex-basis:17px}}

/* V2.3 time allocation */
.alloc-panel{margin-top:16px}.alloc-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}
.alloc-day{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:12px 0}
.alloc-day-header{padding:11px 14px;background:var(--raised);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.alloc-session{display:flex;align-items:center;gap:12px;padding:11px 13px;border-top:1px solid var(--border)}
.alloc-session-text{min-width:0;flex:1}.alloc-session-text .smalltext{margin-top:3px}
.alloc-timeline-scroll{max-width:100%;overflow:auto;border:1px solid var(--border);border-radius:10px}
.alloc-timeline{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px}
.alloc-timeline th,.alloc-timeline td{padding:10px 12px;border:1px solid var(--border);text-align:left;vertical-align:top}
.alloc-timeline thead th{background:var(--raised)}.alloc-timeline th:first-child{position:sticky;left:0;background:var(--panel);min-width:200px;z-index:1}
.alloc-timeline-pill{display:block;border:1px solid var(--brand);background:var(--brand-bg);color:var(--text);padding:5px 8px;border-radius:7px;margin:2px 0;white-space:nowrap;font-size:11px}
.alloc-timeline-pill.is-done{border-color:var(--green);background:rgba(20,160,130,.12)}
.alloc-cal-filter{margin-bottom:14px;gap:10px}.alloc-cal-filter select{flex:1}
@media(max-width:750px){.alloc-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.alloc-session{gap:7px;padding:10px 7px;flex-wrap:wrap}.alloc-session .pill{font-size:11px}}

/* V2.4 — lịch sử và tìm giờ trống */
.event.historical-event{background:rgba(245,158,11,.10);border-left-color:#c78528;border-left-style:dashed;opacity:.90}
.event.event-alert{border-left-color:var(--orange)}.event-status{font-size:9px;opacity:.75}
.free-picker{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--raised)}
.free-windows,.free-slots{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.free-slots .btn{background:var(--panel)}
.history-row{padding:12px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.history-row>div:first-child{min-width:200px;flex:1}.history-row:last-child{border-bottom:0}
@media(max-width:700px){.history-row{gap:8px}.free-slots .btn{flex:1 1 120px}}

/* V2.5 — knowledge topics */
.knowledge-toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:14px}.knowledge-topic-select{min-width:210px;flex:1;max-width:300px}.knowledge-search{min-width:210px;flex:1;max-width:370px}.knowledge-toolbar label{display:block;margin-bottom:4px}.topic-new-row{display:flex;gap:9px}.topic-new-row input{flex:1}.topic-manager-row{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.topic-manager-name{display:flex;align-items:center;flex-wrap:wrap;gap:9px;min-width:0;overflow-wrap:anywhere}.topic-manager-row:last-child{border-bottom:0}@media(max-width:560px){.knowledge-topic-select,.knowledge-search{max-width:none;width:100%}.topic-new-row{flex-direction:column}.topic-manager-row{align-items:flex-start;flex-direction:column}}

/* V2.6: full-day scheduler, one event card per session, responsive horizontal overflow */
.week-scroll{overflow:auto;max-height:min(76vh,960px);overscroll-behavior:contain;scrollbar-gutter:stable}
.weektable.v26-table{display:grid;grid-template-columns:68px repeat(var(--days),minmax(var(--day-min),1fr));width:100%;align-items:start}
.v26-hour-axis,.v26-day-lane{position:relative;height:calc(var(--hour-height) * 24);min-height:0}
.v26-hour-axis{background:var(--raised);border-right:1px solid var(--border)}
.v26-hour-label{position:absolute;left:0;right:0;height:var(--hour-height);border-top:1px solid var(--border);padding:3px 6px;text-align:center;font-size:11px;color:var(--muted)}
.v26-hour-end{position:absolute;top:100%;right:6px;font-size:11px;color:var(--muted);transform:translateY(-100%)}
.v26-day-lane{border-right:1px solid var(--border);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour-height) - 1px),var(--border) calc(var(--hour-height) - 1px),var(--border) var(--hour-height));}
.v26-slot{position:absolute;left:0;right:0;height:var(--hour-height);cursor:crosshair;z-index:0}
.v26-slot:hover{background:rgba(37,99,235,.07)}
.v26-block{position:absolute;z-index:1;display:flex;flex-direction:column;gap:2px;min-width:0;padding:4px 5px;border-radius:6px;border:1px solid rgba(37,99,235,.24);border-left:3px solid var(--brand);background:var(--brand-bg);color:var(--text);overflow:auto;box-shadow:0 1px 2px rgba(15,23,42,.07)}
.v26-block.historical{background:rgba(245,158,11,.10);border-left-color:var(--orange);border-style:dashed}
.v26-block.done{border-left-color:var(--green);background:rgba(22,160,133,.10)}
.v26-block.missed,.v26-block.partial{border-left-color:var(--red)}
.v26-block.locked{border-left-color:var(--orange)}
.v26-block-title{border:0;padding:0;background:transparent;color:var(--text);text-align:left;cursor:pointer;font-weight:650;font-size:11px;line-height:1.25;overflow-wrap:anywhere;white-space:normal;width:100%}
.v26-block-time{font-size:10px;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums}
.v26-block-status{font-size:10px;color:var(--muted)}

function tasksForGoal(gid){
 const projectIds=new Set(db.projects.filter(p=>p.goalId===gid).map(p=>p.id));
 const related=new Set();
 for(const t of db.tasks){if(t.goalId===gid||(t.projectId&&projectIds.has(t.projectId)))related.add(t.id)}
 // A task with a direct goal/project association belongs to that goal's hierarchy.
 let changed=true;
 while(changed){changed=false;for(const t of db.tasks){if(t.parentId&&related.has(t.parentId)&&!related.has(t.id)){related.add(t.id);changed=true}}}
 return db.tasks.filter(t=>related.has(t.id));
}

function allocationTaskIds(type,scopeId){
 if(type==='task'){
  if(!task(scopeId))return new Set();
  let ids=new Set([scopeId]),changed=true;
  while(changed){changed=false;for(let t of db.tasks)if(t.parentId&&ids.has(t.parentId)&&!ids.has(t.id)){ids.add(t.id);changed=true}}
  return ids;
 }
 if(type==='project'){
  let ids=new Set(db.tasks.filter(t=>t.projectId===scopeId).map(t=>t.id));
  let changed=true;while(changed){changed=false;for(let t of db.tasks)if(t.parentId&&ids.has(t.parentId)&&!ids.has(t.id)){ids.add(t.id);changed=true}}
  return ids;
 }
 if(type==='goal')return new Set(tasksForGoal(scopeId).map(t=>t.id));
 return new Set(db.tasks.map(t=>t.id));
}

function allocationData(type,idValue){
 const ids=allocationTaskIds(type,idValue);
 const tasks=db.tasks.filter(t=>ids.has(t.id));
 const blocks=db.blocks.filter(b=>b.taskId&&ids.has(b.taskId)).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
 // Only leaf estimates count, avoiding double-counting parent/child estimates.
 const leaves=tasks.filter(t=>!tasks.some(x=>x.parentId===t.id));
 const estimated=leaves.reduce((n,t)=>n+Math.max(0,Number(t.estimate)||0),0);
 const actual=leaves.reduce((n,t)=>n+Math.max(0,Number(t.actual)||0),0);
 const scheduled=blocks.reduce((n,b)=>n+Math.max(0,b.end-b.start),0);
 const completed=blocks.filter(sessionDone).reduce((n,b)=>n+Math.max(0,b.end-b.start),0);
 const upcoming=blocks.filter(b=>!sessionDone(b)).reduce((n,b)=>n+Math.max(0,b.end-b.start),0);
 // Difference measures planned coverage, NOT knowledge progress or work remaining.
 return {ids,tasks,blocks,estimated,actual,scheduled,completed,upcoming,unallocated:Math.max(0,estimated-scheduled)};
}

function goalTaskTree(t,scope,depth=0){
 const kids=children(t.id).filter(k=>scope.has(k.id)),expanded=view.expanded[t.id]!==false,p=progressOf(t.id);
 const sessions=db.blocks.filter(b=>b.taskId===t.id).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
 return `<div class="goal-tree-node"><div class="goal-task-line" style="--depth:${Math.min(depth,12)}">
 <button class="treeexp" data-toggle-tree="${t.id}" ${kids.length?'':'disabled'} aria-label="${expanded?'Thu gọn':'Mở rộng'} công việc">${kids.length?(expanded?'▾':'▸'):'·'}</button>
 <input type="checkbox" class="check" data-check-task="${t.id}" ${p>=100?'checked':''} aria-label="Đánh dấu hoàn thành ${esc(t.title)}">
 <div class="goal-task-body"><button class="goal-task-name ${p>=100?'goal-done':''}" data-edit-task="${t.id}">${esc(t.title)}</button>
 <div class="goal-task-meta">${sessions.length?`<span>▦ ${sessions.filter(sessionDone).length}/${sessions.length} phiên xong: ${sessions.slice(0,2).map(b=>`${human(b.date)} ${hm(b.start)}–${hm(b.end)}`).join('; ')}${sessions.length>2?'…':''}</span>`:'<span>Chưa xếp lịch</span>'}${t.due?`<span>Hạn ${human(t.due)}</span>`:''}</div></div>
 ${!t.parentId?`<span class="pill ${p>=100?'green':''}">${p}%</span>`:`<span class="pill ${isDone(t)?'green':''}">${isDone(t)?'Hoàn thành':'Chưa hoàn thành'}</span>`}
 <button class="btn small" data-task-allocation="${t.id}" title="Tổng quan phân bổ">◷</button><button class="btn small" data-action="newBlock" data-task="${t.id}" title="Xếp lịch">▦</button>
 <button class="btn small" data-action="newTask" data-parent="${t.id}" data-project="${t.projectId||''}" data-goal="${t.goalId||''}" title="Thêm việc con">＋</button>
 </div>${kids.length&&expanded?`<div class="goal-tree-children">${kids.map(k=>goalTaskTree(k,scope,depth+1)).join('')}</div>`:''}</div>`
}
function goalDetail(g){
 let related=tasksForGoal(g.id),ids=new Set(related.map(t=>t.id)),roots=related.filter(t=>!t.parentId||!ids.has(t.parentId));
 let blocks=db.blocks.filter(b=>ids.has(b.taskId)).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
 let grouped=new Map();blocks.forEach(b=>{if(!grouped.has(b.date))grouped.set(b.date,[]);grouped.get(b.date).push(b)});
 let done=related.filter(t=>progressOf(t.id)>=100).length;
 return head('Mục tiêu / '+esc(g.title),'Theo dõi công việc, lịch thực hiện và tiến độ trong cùng một nơi.',`<button class="btn" data-goal-back="1">← Tất cả mục tiêu</button><button class="btn" data-edit-goal="${g.id}">Sửa mục tiêu</button>`)+
 `<section class="card goal-summary"><div class="row between flexwrap"><div><h2>${esc(g.title)}</h2><p class="muted smalltext">${esc(g.description||'Chưa có mô tả')}</p></div><span class="pill blue">${g.due?'Hạn '+human(g.due):'Không có hạn chót'}</span></div><div class="row between"><span class="smalltext muted">${related.length} công việc · ${done} đã hoàn thành · ${blocks.length} phiên trên lịch</span><b>${progressForGoal(g)}%</b></div>${progressBar(progressForGoal(g))}</section>
 <div class="row between flexwrap" style="margin:16px 0"><div class="tabs"><button class="tab ${view.goalMode==='tree'?'selected':''}" data-goal-mode="tree">☷ Cây công việc</button><button class="tab ${view.goalMode==='calendar'?'selected':''}" data-goal-mode="calendar">▦ Lịch đã xếp</button><button class="tab ${view.goalMode==='allocation'?'selected':''}" data-goal-mode="allocation">◷ Phân bổ thời gian</button></div><div class="btnbar"><button class="btn small" data-action="newProject" data-goal="${g.id}">＋ Dự án</button><button class="btn small primary" data-action="newTask" data-goal="${g.id}">＋ Công việc</button></div></div>`+
 (view.goalMode==='allocation'?allocationPanel('goal',g.id):view.goalMode==='tree'?`<section class="card"><div class="row between"><h2>Công việc thuộc mục tiêu</h2><span class="smalltext muted">Tích nhiệm vụ để hoàn thành cả công việc · Chuyển sang Lịch đã xếp để tích từng phiên</span></div>${roots.length?roots.map(t=>goalTaskTree(t,ids)).join(''):'<div class="empty">Chưa có công việc. Hãy tạo nhiệm vụ mới hoặc thêm dự án vào mục tiêu này.</div>'}</section>`:
 `<section class="card"><div class="row between flexwrap"><h2>Lịch thực hiện công việc</h2><button class="btn small" data-go="calendar">Mở Calendar đầy đủ ↗</button></div>${blocks.length?Array.from(grouped,([date,list])=>`<div class="goal-date-group"><div class="goal-date-head">▦ ${human(date)} <span class="muted smalltext">${list.length} phiên</span></div>${list.map(b=>`<div class="goal-session"><span class="goal-session-time">${hm(b.start)}–${hm(b.end)}</span><input type="checkbox" class="check" data-check-session="${b.id}" ${sessionDone(b)?'checked':''} aria-label="Hoàn thành riêng phiên ${hm(b.start)}–${hm(b.end)}"><button class="goal-task-name ${sessionDone(b)?'goal-done':''}" data-edit-task="${b.taskId}">${esc(task(b.taskId)?.title||'Công việc đã xóa')}</button><span class="pill ${sessionDone(b)?'green':''}">${sessionDone(b)?'Đã học':'Chưa xong'}</span><button class="btn small" data-action="blockDetail" data-id="${b.id}">Sửa lịch</button></div>`).join('')}</div>`).join(''):'<div class="empty">Chưa có công việc nào thuộc mục tiêu được xếp lịch. Bạn có thể dùng nút ▦ trong cây công việc để thêm lịch.</div>'}</section>`)
}
function renderGoals(){if(view.goalId){let g=goal(view.goalId);if(g)return goalDetail(g);view.goalId=null}
 return head('Mục tiêu','Quản lý các mục tiêu từ ngắn hạn đến nhiều năm.',`<button class="btn primary" data-action="newGoal">＋ Mục tiêu mới</button>`)+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${db.goals.map(g=>{let related=tasksForGoal(g.id),ids=new Set(related.map(t=>t.id)),scheduled=db.blocks.filter(b=>ids.has(b.taskId)).length;return `<div class="card"><div class="row between"><span class="pill blue">◎ Mục tiêu</span><button class="btn small" data-edit-goal="${g.id}">Sửa ⋯</button></div><h2 style="margin:14px 0 6px">${esc(g.title)}</h2><div class="muted smalltext" style="min-height:35px">${esc(g.description||'')}</div><div class="row between padtop"><span class="smalltext muted">${g.due?'Hạn '+human(g.due):'Chưa đặt thời hạn'}</span><b>${progressForGoal(g)}%</b></div>${progressBar(progressForGoal(g))}<p class="smalltext muted">${db.projects.filter(p=>p.goalId===g.id).length} dự án · ${related.length} công việc · ${scheduled} phiên trên lịch</p><div class="btnbar"><button class="btn small primary" data-goal-open="${g.id}">Xem công việc & lịch ↗</button><button class="btn small" data-action="newProject" data-goal="${g.id}">＋ Dự án con</button></div></div>`}).join('')||'<div class="card empty">Chưa có mục tiêu. Hãy tạo mục tiêu dài hạn đầu tiên.</div>'}</div>`}
function renderProjects(){
 if(view.projectId){let p=project(view.projectId);if(p){let a=allocationData('project',p.id);return head('Dự án / '+esc(p.title),'Xem tất cả ngày, giờ được phân bổ trong dự án.',`<button class="btn" data-project-back="1">← Tất cả dự án</button><button class="btn" data-edit-project="${p.id}">Sửa dự án</button><button class="btn primary" data-action="newTask" data-project="${p.id}">＋ Công việc</button>`)+`<section class="card"><div class="row between"><div><h2>${esc(p.title)}</h2><p class="muted">${esc(p.description||'')}</p></div><span class="pill">${progressForProject(p)}% công việc</span></div>${progressBar(progressForProject(p))}<p class="muted smalltext">${a.tasks.length} nhiệm vụ · ${a.blocks.length} phiên học/làm việc</p></section>`+allocationPanel('project',p.id)}view.projectId=null}
 return head('Dự án','Phân chia mục tiêu thành dự án, giai đoạn và nhiệm vụ.',`<button class="btn primary" data-action="newProject">＋ Dự án mới</button>`)+`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr))">${db.projects.map(p=>{let n=db.tasks.filter(t=>t.projectId===p.id).length,pr=progressForProject(p),a=allocationData('project',p.id);return `<div class="card"><div class="row between"><span class="pill">▣ Dự án</span><button class="btn small" data-edit-project="${p.id}">Sửa ⋯</button></div><h2 style="margin:14px 0 6px">${esc(p.title)}</h2><p class="muted smalltext">${esc(p.description||'')||'Chưa có mô tả'}</p><p class="smalltext muted">${p.goalId?'Mục tiêu: '+esc(goal(p.goalId)?.title||'—'):'Dự án độc lập'}</p><div class="row between"><span class="muted smalltext">${n} nhiệm vụ · ${p.due?human(p.due):'Không hạn'}</span><b>${pr}%</b></div>${progressBar(pr)}<p class="smalltext muted">◷ ${a.blocks.length} phiên · ${fmtDur(a.scheduled)} đã xếp lịch</p><div class="btnbar padtop"><button class="btn small" data-action="newTask" data-project="${p.id}">＋ Công việc</button><button class="btn small primary" data-project-open="${p.id}">◷ Xem phân bổ thời gian</button><button class="btn small" data-action="filterProject" data-project="${p.id}">Công việc ↗</button></div></div>`}).join('')||'<div class="card empty">Chưa có dự án. Bạn có thể tạo dự án độc lập hoặc gắn với một mục tiêu.</div>'}</div>`}

function taskTreeHTML(parentId=null,depth=0){let items=db.tasks.filter(t=>(t.parentId||null)===parentId).filter(t=>view.projectFilter? t.projectId===view.projectFilter||parentId!==null:true);return items.map(t=>{let kids=children(t.id),expanded=view.expanded[t.id]!==false,p=progressOf(t.id);return `<div class="treegroup"><div class="treeitem"><button class="treeexp" data-toggle-tree="${t.id}" ${kids.length?'':'disabled'}>${kids.length?(expanded?'▾':'▸'):'·'}</button><input type="checkbox" class="check" data-check-task="${t.id}" ${p>=100?'checked':''}><span class="clickable" data-edit-task="${t.id}" style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(t.title)}</span><span class="pill ${p>=100?'green':''}">${p}%</span><button class="btn small" data-action="newTask" data-parent="${t.id}" title="Thêm nhiệm vụ con">＋</button><button class="btn small" data-task-allocation="${t.id}" title="Tổng quan các phiên">◷</button><button class="btn small" data-edit-task="${t.id}">⋯</button></div>${kids.length&&expanded?`<div class="treeindent">${taskTreeHTML(t.id,depth+1)}</div>`:''}</div>`}).join('')}
function renderTasks(){let all=db.tasks.filter(t=>view.taskFilter==='all'||(view.taskFilter==='unscheduled'&&!db.blocks.some(b=>b.taskId===t.id))||(view.taskFilter==='pending'&&progressOf(t.id)<100)||(view.taskFilter==='done'&&progressOf(t.id)===100)||(view.taskFilter==='overdue'&&t.due&&t.due<today()&&progressOf(t.id)<100)).filter(t=>!view.projectFilter||t.projectId===view.projectFilter).filter(t=>!view.search||t.title.toLowerCase().includes(view.search.toLowerCase()));let tabs=[['all','Tất cả'],['unscheduled','Chưa xếp lịch'],['pending','Chưa xong'],['overdue','Quá hạn'],['done','Hoàn thành']];return head('Công việc','Công việc gốc tự tính %, công việc con chỉ có một lịch và được xác nhận hoàn thành.',`<button class="btn" data-action="bulkTasks">＋ Nhập hàng loạt</button><button class="btn primary" data-action="newTask">＋ Công việc</button>`)+`<section class="card"><div class="row flexwrap between" style="margin-bottom:16px"><div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${view.taskFilter===k?'selected':''}" data-task-filter="${k}">${l}</button>`).join('')}</div><div class="btnbar"><button class="btn small ${view.taskMode==='tree'?'primary':''}" data-task-mode="tree">☷ Cây</button><button class="btn small ${view.taskMode==='list'?'primary':''}" data-task-mode="list">☰ Danh sách</button><button class="btn small ${view.taskMode==='kanban'?'primary':''}" data-task-mode="kanban">▤ Kanban</button></div></div><div class="row flexwrap" style="margin-bottom:15px"><input id="taskSearch" style="max-width:280px" placeholder="Tìm công việc..." value="${esc(view.search)}"><select id="projectFilter" style="max-width:245px"><option value="">Tất cả dự án</option>${db.projects.map(p=>`<option value="${p.id}" ${view.projectFilter===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></div>${view.taskMode==='tree'&&view.taskFilter==='all'&&!view.search?taskTreeHTML()||'<div class="empty">Chưa có nhiệm vụ</div>':view.taskMode==='kanban'?`<div class="grid" style="grid-template-columns:repeat(3,minmax(200px,1fr));overflow:auto">${[['todo','Chưa bắt đầu'],['doing','Đang thực hiện'],['done','Hoàn thành']].map(([s,t])=>`<div style="background:var(--raised);border-radius:11px;padding:10px"><h3>${t}</h3>${all.filter(a=>(progressOf(a.id)>=100?'done':progressOf(a.id)>0?'doing':'todo')===s).map(x=>`<div class="card" style="margin:8px 0;padding:11px"><div class="clickable" data-edit-task="${x.id}">${esc(x.title)}</div>${!x.parentId?`<p class="smalltext muted">${progressOf(x.id)}%</p>${progressBar(progressOf(x.id))}`:`<p class="smalltext muted">${isDone(x)?'Hoàn thành':'Chưa hoàn thành'}</p>`}</div>`).join('')}</div>`).join('')}</div>`:all.map(t=>taskRow(t)).join('')||'<div class="empty">Không có công việc phù hợp bộ lọc.</div>'}</section>`}
function renderCalendar(){let date=view.calDate,mode=view.calMode,d=dateObj(date),year=d.getFullYear(),month=d.getMonth();let opts=[['year','Năm'],['month','Tháng'],['week','Tuần'],['day','Ngày'],['timeline','Timeline']];let title=mode==='year'?year:mode==='month'?`Tháng ${month+1}/${year}`:mode==='day'?human(date):mode==='week'?`Tuần ${human(addDays(date,-(d.getDay()+6)%7))}`:`Timeline · ${month+1}/${year}`;return head('Calendar','Lịch 24 giờ theo năm, tháng, tuần, ngày và Timeline.',`<button class="btn" data-action="cleanupDeletedHistory">♻ Dọn lịch sử việc đã xóa</button><button class="btn" data-action="newBlock">＋ Xếp lịch</button><button class="btn primary" data-go="scheduler">⟳ Lập lịch thông minh</button>`)+`<section class="card"><div class="row flexwrap between alloc-cal-filter"><label for="calendarAllocationScope">Phạm vi lịch</label><select id="calendarAllocationScope" style="max-width:450px">${allocationScopeOptions(view.allocType,view.allocId)}</select></div><div class="calendar-controls"><div class="btnbar"><button class="btn small" data-cal-shift="-1">‹</button><button class="btn small" data-action="calToday">Hôm nay</button><button class="btn small" data-cal-shift="1">›</button><b>${title}</b></div><div class="tabs">${opts.map(([k,v])=>`<button class="tab ${mode===k?'selected':''}" data-cal-mode="${k}">${v}</button>`).join('')}</div></div>${({year:renderYear,month:renderMonth,week:()=>renderWeek(false),day:()=>renderWeek(true),timeline:renderTimeline}[mode])()}</section>`}
function renderYear(){let year=dateObj(view.calDate).getFullYear(),months=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];return `<div class="yeargrid">${months.map((label,m)=>{let first=(new Date(year,m,1).getDay()+6)%7,days=new Date(year,m+1,0).getDate();return `<div class="card mini-month" data-jump-month="${year}-${pad(m+1)}-01"><div class="row between" style="margin-bottom:10px"><b>${label}</b><span class="smalltext muted">${[...db.blocks,...(db.sessionHistory||[])].filter(b=>filterCalendarBlock(b)&&b.date.startsWith(`${year}-${pad(m+1)}`)).length} phiên</span></div><div class="mini-days">${['T2','T3','T4','T5','T6','T7','CN'].map(s=>`<span class="muted">${s}</span>`).join('')}${Array(first).fill('<span></span>').join('')}${Array.from({length:days},(_,i)=>{let day=`${year}-${pad(m+1)}-${pad(i+1)}`,n=calendarEntries(day).filter(filterCalendarBlock).length;return `<span data-jump-day="${day}" class="${n?'busy':''} ${day===today()?'current':''}" title="${n} phiên">${i+1}</span>`}).join('')}</div></div>`}).join('')}</div>`}
function renderMonth(){let d=dateObj(view.calDate),y=d.getFullYear(),m=d.getMonth(),start=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),count=Math.ceil((start+days)/7)*7;return `<div class="monthgrid">${['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','CN'].map(x=>`<div class="monthdow">${x}</div>`).join('')}${Array.from({length:count},(_,i)=>{let day=addDays(`${y}-${pad(m+1)}-01`,i-start),out=dateObj(day).getMonth()!==m,bs=calendarEntries(day).filter(filterCalendarBlock);return `<div class="daycell ${out?'outside':''} ${day===today()?'today':''}" data-jump-day="${day}"><div class="daynum">${dateObj(day).getDate()}</div>${bs.slice(0,3).map(b=>eventHTML(b)).join('')}${bs.length>3?`<div class="muted smalltext">+${bs.length-3} việc</div>`:''}</div>`}).join('')}</div>`}
function eventHTML(b){let s=sessionOutcome(b);return `<div class="session-event"><button class="event ${b.locked?'locked':''} ${sessionDone(b)?'done':''} ${b.historical?'historical-event':''} ${['missed','partial','unconfirmed'].includes(s)?'event-alert':''}" ${b.historical?`data-history-id="${b.id}"`:`data-block="${b.id}"`} title="${hm(b.start)}–${hm(b.end)} · ${esc(blockTitle(b))} · ${outcomeLabels[s]||'Dự kiến'}">${hm(b.start)} ${s==='done'?'✓ ':s==='missed'?'✕ ':s==='partial'?'◐ ':b.historical?'↪ ':''}${esc(blockTitle(b))} <span class="event-status">${outcomeLabels[s]||''}</span></button>${b.taskId&&!b.historical?`<input type="checkbox" class="check session-calendar-check" data-check-session="${b.id}" ${sessionDone(b)?'checked':''} title="Chỉ đánh dấu phiên này" aria-label="Hoàn thành phiên ${esc(blockTitle(b))}">`:''}</div>`}
function layoutDayBlocks(blocks){
 const sorted=blocks.slice().sort((a,b)=>a.start-b.start||a.end-b.end), groups=[],active=[];
 for(const b of sorted){const overlapping=active.filter(x=>x.end>b.start);active.length=0;active.push(...overlapping);const used=new Set(active.map(x=>x.column));let col=0;while(used.has(col))col++;const entry={...b,column:col};active.push({end:b.end,column:col});let group=groups.at(-1);if(!group||b.start>=group.end){groups.push({end:b.end,items:[entry]})}else{group.items.push(entry);group.end=Math.max(group.end,b.end)}}
 return groups.flatMap(group=>{const columns=Math.max(1,...group.items.map(x=>x.column+1));return group.items.map(x=>({...x,columns}))});
}
function renderDayBlock(b,hourHeight){let outcome=sessionOutcome(b),height=Math.max(14,(b.end-b.start)*hourHeight/60-3),top=Math.max(0,b.start)*hourHeight/60,left=(b.column/b.columns*100),width=100/b.columns;
 const name=esc(blockTitle(b)),label=esc(outcomeLabels[outcome]||'Dự kiến'),time=hm(b.start)+'–'+hm(b.end),historical=!!b.historical;

 /* V2.8: time-aware session classification. Never silently mark an overdue session as missed. */
 function v28Now(){return new Date()}
 function v28BlockEnd(b){return new Date(b.date+'T00:00:00').getTime()+Number(b.end||0)*60000}
 function v28BlockStart(b){return new Date(b.date+'T00:00:00').getTime()+Number(b.start||0)*60000}
 function v28State(b,now=v28Now().getTime()){
  if(b.historical)return b.outcome==='done'?'done':b.outcome==='partial'?'partial':b.outcome==='missed'?'missed':'rescheduled';
  if(sessionDone(b))return 'done';
  if(['partial','missed','rescheduled'].includes(b.outcome))return b.outcome;
  return b.activeSince?'running':v28BlockEnd(b)<=now?'overdue':v28BlockStart(b)>now?'upcoming':'current';
 }
 const v28Labels={done:'Hoàn thành',partial:'Một phần',missed:'Bỏ lỡ',rescheduled:'Đã dời',overdue:'Quá giờ · Chưa xác nhận',upcoming:'Sắp tới',current:'Đến giờ thực hiện',running:'Đang thực hiện'};
 const v28Colors={empty:'#cbd5e1',done:'#facc15',partial:'#ef4444',missed:'#ef4444',rescheduled:'#f59e0b',overdue:'#ef4444',upcoming:'#3b82f6',current:'#3b82f6',running:'#10b981'};

  const marks=new Set([0,1440]);arr.forEach(b=>{marks.add(Math.max(0,Math.min(1440,b.start)));marks.add(Math.max(0,Math.min(1440,b.end)))});
  const limits=[...marks].sort((a,b)=>a-b),rank={missed:8,overdue:7,partial:6,running:5,current:4,done:3,upcoming:2,rescheduled:1};
  let segments=[];for(let i=0;i<limits.length-1;i++){let a=limits[i],z=limits[i+1],cover=arr.filter(b=>b.start<z&&b.end>a);cover.sort((x,y)=>(rank[v28State(y)]||0)-(rank[v28State(x)]||0));let lead=cover[0],state=lead?v28State(lead):'empty';segments.push({a,z,cover,state,lead})}
  let now=v28Now(),isToday=date===today(),min=now.getHours()*60+now.getMinutes()+now.getSeconds()/60;
  const renderSegments=segments.map((seg,i)=>{let names=seg.cover.map(b=>`${hm(b.start)}–${hm(b.end)} ${blockTitle(b)} (${v28Labels[v28State(b)]||'Sự kiện'})`).join(' / ');return `<button type="button" class="v28-segment" data-v28-segment="${i}" style="left:${(seg.a/1440*100).toFixed(5)}%;width:${((seg.z-seg.a)/1440*100).toFixed(5)}%;background:${v28Colors[seg.state]}" title="${esc(hm(seg.a)+'–'+hm(seg.z)+(names?' · '+names:' · Trống'))}" aria-label="${esc(hm(seg.a)+'–'+hm(seg.z)+(names?' '+names:' Trống'))}"></button>`}).join('');
  const legend=[['empty','Trống'],['done','Đã qua và hoàn thành'],['upcoming','Sắp tới / đến giờ'],['overdue','Quá giờ / chưa xong'],['running','Đang thực hiện']].map(([key,label])=>`<span><i style="background:${v28Colors[key]}"></i>${label}</span>`).join('');
  return `<section class="card" id="v28TimelineCard"><div class="row between flexwrap"><h2 style="margin:0">▰ Timeline 24 giờ · ${human(date)}</h2><span class="smalltext muted" id="v28Clock">${isToday?'Hiện tại: '+pad(now.getHours())+':'+pad(now.getMinutes()):'Đang xem ngày khác'}</span></div><div class="v28-strip" id="v28Strip">${renderSegments}${isToday?`<div id="v28NowLine" class="v28-now-line" style="left:${(min/1440*100).toFixed(5)}%" title="Thời gian hiện tại"></div>`:''}</div><div class="v28-ticks">${[0,4,8,12,16,20,24].map(x=>`<span>${pad(x)}:00</span>`).join('')}</div><div class="v28-legend">${legend}</div><p class="muted smalltext" style="margin:8px 0 0">Vạch đen: thời gian thực. Nhấn đoạn màu để xem công việc trong khoảng giờ đó. Khi phiên trùng giờ, màu ưu tiên trạng thái cần xử lý.</p><div id="v28DynamicNotice">${v28DailyNotices(date)}</div></section>`;

 function v28SegmentDetails(date,i){let arr=db.blocks.filter(b=>b.date===date&&Number.isFinite(b.start)&&Number.isFinite(b.end)&&b.end>b.start),marks=new Set([0,1440]);arr.forEach(b=>{marks.add(Math.max(0,Math.min(1440,b.start)));marks.add(Math.max(0,Math.min(1440,b.end)))});let lim=[...marks].sort((a,b)=>a-b),a=lim[i],z=lim[i+1];if(a===undefined||z===undefined)return;let bs=arr.filter(b=>b.start<z&&b.end>a);openModal('Timeline '+hm(a)+'–'+hm(z),bs.length?bs.map(b=>`<div class="v28-result-row"><div><b>${v28Name(b)}</b><div class="muted smalltext">${hm(b.start)}–${hm(b.end)} · ${v28Labels[v28State(b)]}</div></div><button class="btn small" data-v28-modal-open="${esc(b.id)}">Chi tiết</button></div>`).join(''):'<div class="empty">Khoảng thời gian này chưa có phiên được xếp lịch.</div>',[],true);document.querySelectorAll('[data-v28-modal-open]').forEach(x=>x.onclick=()=>{closeModal();editBlock(x.dataset.v28ModalOpen)})}
 function v28SessionScope(b,type,scope){if(!b.taskId)return false;if(type==='all')return true;return allocationTaskIds(type,scope).has(b.taskId)}
 function v28ReportData(){let p=view.reportPeriod||'30',range=p==='all'?null:Number(p)||30,end=today(),start=range?addDays(end,1-range):null,[type,scope]=(view.reportScope||'all|').split('|');let inPeriod=b=>(!start||b.date>=start)&&b.date<=end;let live=db.blocks.filter(b=>v28SessionScope(b,type,scope)&&inPeriod(b)),hist=(db.sessionHistory||[]).filter(b=>v28SessionScope(b,type,scope)&&inPeriod(b));
  let records=[...live.map(b=>({b,state:v28State(b),history:false})),...hist.map(b=>({b,state:v28State(b),history:true}))].sort((a,b)=>b.b.date.localeCompare(a.b.date)||b.b.start-a.b.start);

function occupiedOn(date,exceptId){return db.blocks.filter(b=>b.date===date&&b.id!==exceptId).sort((a,b)=>a.start-b.start)}
function freeIntervals(date,exceptId){let ranges=availableWindows(date),busy=occupiedOn(date,exceptId),free=[];for(let [st,en] of ranges){let cursor=st;for(let b of busy){if(b.end<=cursor||b.start>=en)continue;if(b.start>cursor)free.push([cursor,Math.min(b.start,en)]);cursor=Math.max(cursor,b.end);if(cursor>=en)break}if(cursor<en)free.push([cursor,en])}return free.filter(([a,b])=>b>a)}

function editBlock(bid,slot=null,tid=null){

 async function initSupabase(){setSync('Đang khởi tạo');const c=window.PLANNER_CONFIG||{};if(!c.supabaseUrl||!c.supabaseAnonKey){setSync('Chưa cấu hình','Thiếu cấu hình Supabase.');return}
  try{const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');const key=PREFIX+'auth_tab';
   // sessionStorage scopes credentials to the tab (not localStorage, not other apps).
   // Detect common "Duplicate Tab" sessionStorage copies; prefer clearing the new tab session.
   const channel=new BroadcastChannel(PREFIX+'tab_guard');tabChannel=channel;
   const token=sessionStorage.getItem(PREFIX+'tab_identity')||crypto.randomUUID();
   let duplicated=false;channel.onmessage=e=>{if(e.data?.kind==='probe'&&e.data.token===token)channel.postMessage({kind:'present',token});else if(e.data?.kind==='present'&&e.data.token===token)duplicated=true};
   channel.postMessage({kind:'probe',token});await new Promise(r=>setTimeout(r,180));
   if(duplicated){sessionStorage.removeItem(key);sessionStorage.setItem(PREFIX+'tab_identity',crypto.randomUUID())}else sessionStorage.setItem(PREFIX+'tab_identity',token);
   syncClient=mod.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{storage:sessionStorage,storageKey:key,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   const {data,error}=await syncClient.auth.getSession();if(error)throw error;
   syncClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session?.user&&syncSession?.user?.id!==session.user.id){setTimeout(()=>{void activateSession(session)},0)}else if(event==='SIGNED_OUT'&&syncSession){setTimeout(switchToGuest,0)}else if(event==='TOKEN_REFRESHED'&&session)syncSession=session});
   if(data.session)await activateSession(data.session);else setSync('Chưa đăng nhập');render();
  }catch(e){setSync('Lỗi khởi tạo Supabase',e.message);toast('Không thể khởi tạo Supabase: '+e.message)}
 }
 async function activateSession(session){if(!session?.user)return;const uid=session.user.id;if(syncSession?.user?.id===uid)return;
  clearTimeout(syncTimer);const epoch=++syncEpoch;syncSession=session;syncConflict=null;syncBusy=false;syncRevision=accountMeta(uid).revision??-1;const cached=accountKey(uid);
  try{const raw=localStorage.getItem(cached);db=raw&&validSnapshot(JSON.parse(raw))?normalized(JSON.parse(raw)):defaults()}catch{db=defaults()}
  view.knowledgeTopicFilter='all';setSync('Đang kiểm tra dữ liệu đám mây');render();await pullRemote(false,epoch);if(sameUser(epoch,uid))expandRecurrences();
 }
 async function auth(mode){if(!syncClient){toast('Supabase chưa sẵn sàng.');return}let email=$('#authEmail')?.value?.trim(),password=$('#authPassword')?.value;if(!email||!password){toast('Nhập email và mật khẩu.');return}if(password.length<6){toast('Mật khẩu tối thiểu 6 ký tự.');return}
  try{const {data,error}=await (mode==='signup'?syncClient.auth.signUp({email,password}):syncClient.auth.signInWithPassword({email,password}));if(error)throw error;
   if(data.session){await activateSession(data.session);toast('Đã đăng nhập tài khoản trong tab này.')}else toast('Nếu cần, hãy kiểm tra email xác nhận trước khi đăng nhập.')
  }catch(e){toast('Lỗi tài khoản: '+e.message)}
 }
 async function logoutTab(){if(!syncClient)return;const uid=syncSession?.user?.id;clearTimeout(syncTimer);syncEpoch++;try{await syncClient.auth.signOut({scope:'local'})}catch(e){toast('Không thể đăng xuất: '+e.message);return}switchToGuest();toast('Đã đăng xuất tab này. Dữ liệu của tài khoản vẫn được lưu an toàn trên thiết bị.')}
 async function resetPassword(){const email=$('#authEmail')?.value?.trim();if(!email){toast('Nhập email trước khi yêu cầu đặt lại mật khẩu.');return}try{const {error}=await syncClient.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)throw error;toast('Nếu email hợp lệ, bạn sẽ nhận được hướng dẫn đặt lại mật khẩu.')}catch(e){toast('Không gửi được email: '+e.message)}}
 async function changePassword(){const old=$('#oldPassword')?.value,pass=$('#newPassword')?.value,email=syncSession?.user?.email;if(!email||!old||!pass||pass.length<6){toast('Nhập mật khẩu hiện tại và mật khẩu mới tối thiểu 6 ký tự.');return}try{const {error:check}=await syncClient.auth.signInWithPassword({email,password:old});if(check)throw Error('Mật khẩu hiện tại không đúng.');const {error}=await syncClient.auth.updateUser({password:pass});if(error)throw error;toast('Đã đổi mật khẩu thành công.')}catch(e){toast('Lỗi đổi mật khẩu: '+e.message)}}
 async function fetchCloud(uid,epoch){const {data,error}=await syncClient.from(CLOUD_TABLE).select('payload,revision').eq('user_id',uid).eq('app_id',APP_ID).maybeSingle();if(!sameUser(epoch,uid))return null;if(error)throw error;return data}
 async function pullRemote(userInitiated=false,forcedEpoch=null){if(!syncClient||!syncSession)return;const uid=syncSession.user.id,epoch=forcedEpoch??syncEpoch;
  try{const remote=await fetchCloud(uid,epoch);if(!sameUser(epoch,uid))return;if(remote===null&&!sameUser(epoch,uid))return;
   const dirty=isDirty(uid),localHasData=validSnapshot(db)&&['goals','projects','tasks','blocks','notes','knowledge','sessionHistory'].some(k=>(db[k]||[]).length);
   if(!remote){syncRevision=-1;if(dirty||localHasData){if(!dirty)storeAccount(uid,true);setSync('Chưa đồng bộ — dữ liệu mới trên thiết bị');scheduleSync()}else setSync('Đám mây chưa có dữ liệu');return}
   if(!validSnapshot(remote.payload))throw Error('Dữ liệu trên máy chủ không hợp lệ.');
   const savedRev=accountMeta(uid).revision??-1;
   if(dirty&&savedRev!==remote.revision){syncConflict={remote:remote.payload,revision:remote.revision};setSync('Có xung đột — cần chọn phiên bản');return}
   if(dirty&&savedRev===remote.revision){syncRevision=remote.revision;scheduleSync();return}
   if(userInitiated&&localHasData&&!confirm('Tải phiên bản trên đám mây vào tài khoản này? Dữ liệu chưa đồng bộ sẽ không bị thay thế.'))return;
   db=normalized(remote.payload);syncRevision=remote.revision;storeAccount(uid,false);markSynced(uid,remote.revision);render();
  }catch(e){if(sameUser(epoch,uid))setSync('Ngoại tuyến / Lỗi kết nối',e.message)}
 }
 async function pushRemote(userInitiated=false){if(!syncClient||!syncSession||syncBusy||syncConflict)return;const uid=syncSession.user.id,epoch=syncEpoch;
  if(!isDirty(uid)){if(userInitiated)await pullRemote(false);return}
  if(!navigator.onLine){setSync('Ngoại tuyến — chờ đồng bộ');return}
  syncBusy=true;setSync('Đang đồng bộ');let sent=JSON.stringify(db),base=accountMeta(uid).revision??-1;
  try{const {data,error}=await syncClient.rpc('planner_sync_commit',{p_app_id:APP_ID,p_expected_revision:base,p_payload:JSON.parse(sent)});if(!sameUser(epoch,uid))return;if(error)throw error;
   if(!data||typeof data!=='object')throw Error('Phản hồi máy chủ không hợp lệ.');
   if(!data.ok){syncConflict={remote:data.payload,revision:data.revision};setSync('Có xung đột — cần chọn phiên bản');return}
   syncRevision=data.revision;
   if(JSON.stringify(db)===sent){markSynced(uid,data.revision)}else{const meta=accountMeta(uid);localStorage.setItem(metaKey(uid),JSON.stringify({...meta,dirty:true,revision:data.revision}));setSync('Chưa đồng bộ — có thay đổi mới');scheduleSync()}
  }catch(e){if(sameUser(epoch,uid)){setSync(navigator.onLine?'Đồng bộ lỗi — sẽ thử lại':'Ngoại tuyến — chờ đồng bộ',e.message);clearTimeout(syncTimer);syncTimer=setTimeout(()=>{if(sameUser(epoch,uid))void pushRemote()},30000)}}finally{syncBusy=false}
 }
 function mergeSnapshot(a,b){const out=normalized(a);for(const k of ['goals','projects','tasks','blocks','sessionHistory','notes','knowledge']){const seen=new Map(out[k].map(x=>[x.id,x]));for(const x of b[k]||[]){if(seen.has(x.id)&&JSON.stringify(seen.get(x.id))!==JSON.stringify(x))throw Error('Có ID trùng nhưng nội dung khác trong '+k+': '+x.id);if(!seen.has(x.id)){out[k].push(x);seen.set(x.id,x)}}}out.knowledgeTopics=[...new Set([...(out.knowledgeTopics||[]),...(b.knowledgeTopics||[])])];return out}
 function migrateGuest(){const uid=syncSession?.user?.id;if(!uid)return toast('Hãy đăng nhập trước.');const guest=load();if(!validSnapshot(guest))return toast('Dữ liệu khách không hợp lệ.');if(!confirm('Chuyển dữ liệu khách cũ vào tài khoản này? Hãy xuất JSON trước. Hệ thống sẽ gộp theo ID, không xóa bản gốc.'))return;
  try{const merged=mergeSnapshot(db,guest);db=merged;save();render();toast('Đã gộp dữ liệu khách. Bản gốc vẫn được giữ nguyên; đang chờ đồng bộ.')}catch(e){toast('Chưa thể gộp: '+e.message+'. Hãy xuất JSON để xử lý thủ công.')}

 async function resolveConflict(choice){if(!syncConflict||!syncSession)return;const uid=syncSession.user.id,conflict=syncConflict;
  if(choice==='cloud'){if(!validSnapshot(conflict.remote))return toast('Bản đám mây không hợp lệ.');if(!confirm('Chọn dữ liệu đám mây? Hãy xuất JSON dữ liệu trên thiết bị trước nếu muốn giữ bản hiện tại.'))return;try{localStorage.setItem(PREFIX+'conflict_backup_'+uid+'_'+Date.now(),JSON.stringify(db))}catch(e){}db=normalized(conflict.remote);syncRevision=conflict.revision;syncConflict=null;storeAccount(uid,false);markSynced(uid,conflict.revision);render();return}
  if(!confirm('Ghi bản thiết bị lên đám mây và thay thế bản đám mây hiện tại? Hãy sao lưu cả hai phiên bản trước khi tiếp tục.'))return;
  try{localStorage.setItem(PREFIX+'cloud_conflict_backup_'+uid+'_'+Date.now(),JSON.stringify(conflict.remote))}catch(e){}syncRevision=conflict.revision;syncConflict=null;localStorage.setItem(metaKey(uid),JSON.stringify({...accountMeta(uid),dirty:true,revision:conflict.revision}));await pushRemote(true);
 }
// Recurrence: generate only a limited horizon when opening the app, with unique occurrence IDs.
function expandRecurrences(){let change=false;let base=[...db.tasks].filter(t=>t.recurrence&&t.recurrence!=='none'&&!t.recurringFrom);for(let t of base){let existing=new Set(db.tasks.filter(x=>x.recurringFrom===t.id).map(x=>x.occurrenceDate));let reference=t.start||today();for(let n=0;n<30;n++){let day=addDays(today(),n);if(day<reference||existing.has(day))continue;let eligible=t.recurrence==='daily'||(t.recurrence==='weekly'&&dateObj(day).getDay()===dateObj(reference).getDay())||(t.recurrence==='monthly'&&dateObj(day).getDate()===dateObj(reference).getDate());if(!eligible)continue;db.tasks.push({...t,id:id(),title:t.title,progress:0,actual:0,status:'todo',start:day,due:day,recurrence:'none',recurringFrom:t.id,occurrenceDate:day,parentId:t.parentId||''});change=true}}if(change)save(true)}
function keyboard(e){if(!syncSession?.user)return;if(e.key==='Escape'&&modal){closeModal();return}if(modal||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();globalSearch()}if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();editTask()}}
document.addEventListener('change',e=>{let s=e.target;if(!s.matches('[data-time-hour],[data-time-minute]'))return;let k=s.getAttribute('data-time-hour')||s.getAttribute('data-time-minute'),h=document.querySelector(`[data-time-hour="${k}"]`),m=document.querySelector(`[data-time-minute="${k}"]`);if(!h||!m)return;let is24=h.value==='24';for(const op of m.options)op.disabled=is24&&op.value!=='00';if(is24)m.value='00';syncTimePick(k,h.value+':'+m.value)});
document.addEventListener('keydown',keyboard);render();setInterval(v28Tick,30000);void initSupabase();window.addEventListener('online',()=>{if(syncSession&&isDirty(syncSession.user.id))scheduleSync()});window.addEventListener('focus',()=>{if(syncSession&&!isDirty(syncSession.user.id)&&!syncBusy&&!syncConflict)void pullRemote(false)});
